version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=production-secret-key-change-in-env
      - DATABASE_URL=postgresql://resumeaipostgres:securepassword@db:5432/resumeaidb
      - AI_PROVIDER=none
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=resumeaipostgres
      - POSTGRES_PASSWORD=securepassword
      - POSTGRES_DB=resumeaidb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
