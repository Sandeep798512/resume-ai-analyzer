{% extends "base.html" %}
{% block title %}404 Page Not Found — ResumeAI{% endblock %}
{% block content %}
<div class="card" style="max-width: 500px; margin: 4rem auto; text-align: center; padding: 3rem;">
    <h1 style="font-size: 3rem; color: var(--primary); margin-bottom: 1rem;">404</h1>
    <h2 style="color: var(--secondary); margin-bottom: 1rem;">Page Not Found</h2>
    <p style="color: var(--text-muted); margin-bottom: 2rem;">The URL you requested does not exist or has been moved.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">Return to Homepage</a>
</div>
{% endblock %}
