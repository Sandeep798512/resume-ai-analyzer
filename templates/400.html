{% extends "base.html" %}
{% block title %}400 Bad Request — ResumeAI{% endblock %}
{% block content %}
<div class="card" style="max-width: 500px; margin: 4rem auto; text-align: center; padding: 3rem;">
    <h1 style="font-size: 3rem; color: var(--danger); margin-bottom: 1rem;">400</h1>
    <h2 style="color: var(--secondary); margin-bottom: 1rem;">Bad Request</h2>
    <p style="color: var(--text-muted); margin-bottom: 2rem;">The server could not understand your request. Please check input parameters or uploaded files.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">Return Home</a>
</div>
{% endblock %}
