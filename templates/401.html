{% extends "base.html" %}
{% block title %}401 Unauthorized — ResumeAI{% endblock %}
{% block content %}
<div class="card" style="max-width: 500px; margin: 4rem auto; text-align: center; padding: 3rem;">
    <h1 style="font-size: 3rem; color: var(--warning); margin-bottom: 1rem;">401</h1>
    <h2 style="color: var(--secondary); margin-bottom: 1rem;">Authentication Required</h2>
    <p style="color: var(--text-muted); margin-bottom: 2rem;">Please log in to access this page or resource.</p>
    <a href="{{ url_for('login') }}" class="btn btn-primary">Log In Now</a>
</div>
{% endblock %}
